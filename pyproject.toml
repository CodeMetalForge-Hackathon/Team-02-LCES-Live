[project]
name = "lces-live"
version = "0.1.0"
description = "LCES Live MQTT, WebSocket, and PostGIS services"
requires-python = "==3.13.*"   # the Pi's Python (Debian 13); same everywhere so the lock matches
dependencies = [
    "fastapi>=0.115",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false
default-groups = ["engine"]   # plain `uv sync` installs the engine too (the Pi runs everything)
# pyrothermel has no Linux/ARM wheel: it compiles from source. Pin its build tools too (uv.lock doesn't cover them).
build-constraint-dependencies = ["scikit-build-core==1.1.2", "pybind11==3.1.0", "cmake==4.4.4"]

[dependency-groups]
engine = [
    "numpy>=2.4.6",
    "pyproj>=3.7.2",
    "pyrothermel>=0.1.4",
    "rasterio>=1.4.4",
]
