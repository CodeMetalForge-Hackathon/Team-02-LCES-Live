[project]
name = "lces-live"
version = "0.1.0"
description = "LCES Live MQTT, WebSocket, and PostGIS services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[dependency-groups]
engine = [
    "numpy>=2.4.6",
    "pyproj>=3.7.2",
    "pyrothermel>=0.1.4",
    "rasterio>=1.4.4",
]
