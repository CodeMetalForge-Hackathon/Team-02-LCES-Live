; =============================================================================
; Escape-route margin system: sensor-node firmware (Seeed XIAO ESP32-C5)
;
; Each [env:...] below builds ONE small program from its own folder in src/,
; so you can flash each test on its own:
;     pio run -e c5_alive -t upload -t monitor
;
; Platform choice: Seeed's official PlatformIO platform, pinned to a release
; tag so it can't change mid-hackathon. It ships the arduino-esp32 3.3.x core
; and the "seeed-xiao-esp32-c5" board definition (8 MB flash, PSRAM).
; Install it once:
;     pio pkg install -g -p "https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.1"
; =============================================================================

[platformio]
default_envs = c5_alive

; ---- Settings shared by every environment -----------------------------------
[env]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.1
board     = seeed-xiao-esp32-c5
framework = arduino

monitor_speed   = 115200
monitor_filters = time            ; prefix each serial line with PC time
; Uncomment only if auto-detect picks the wrong port.
; Linux: /dev/ttyACM0   Windows: COM3
; upload_port  = /dev/ttyACM0
; monitor_port = /dev/ttyACM0

; USB serial: the board definition ALREADY adds
;     -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
; so Serial.print() goes out over the USB-C cable. Don't add them again here
; or the compiler prints "redefined" warnings.
build_flags =
    -DCORE_DEBUG_LEVEL=1          ; show ESP-IDF errors only

; Libraries are downloaded once and only compiled into envs that #include them.
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    beegee-tokyo/DHT sensor library for ESPx@^1.19
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    ; jgromes/RadioLib@^7.1.0     ; LoRa: enable once the module (SX1262 or SX1276) is known

; ---- Task A: board/toolchain smoke test -------------------------------------
[env:c5_alive]
build_src_filter = +<c5_alive/>

; ---- Compile-only check that every library builds for the C5 (no board needed)
[env:lib_check]
build_src_filter = +<lib_check/>

; ---- N3 bring-up step 2: Grove LED Socket (blue LED) on D1 = GPIO0 ---------
[env:led_test]
build_src_filter = +<led_test/>

; Same LED test but on D0: swap test for the DHT11 wiring (LED module on the DHT's cable)
[env:led_test_d0]
build_src_filter = +<led_test/>
build_flags = ${env.build_flags} -DLED_TEST_PIN=D0

; ---- DHT11 diagnostic: finds the sensor pin, tries two libraries (USB only) --
[env:dht_diag]
build_src_filter = +<dht_diag/>

; ---- N3 bring-up step 3: the real node, heartbeat to sensors/N3/wx over FireNet
[env:node_n3]
build_src_filter = +<node_n3/>
